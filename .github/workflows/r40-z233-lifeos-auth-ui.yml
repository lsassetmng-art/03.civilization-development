name: R40-Z233 LifeOS authentication UI

on:
  push:
    branches:
      - work/r40-z229-lifeos-entry-guard-20261107
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r40-z233-lifeos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifeos-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: 08.civilization-portal-site/civilization-portal-site-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 08.civilization-portal-site/civilization-portal-site-web/package-lock.json

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run LifeOS browser UI tests
        run: |
          set -euo pipefail
          cat > /tmp/r40-z233-playwright.config.cjs <<'CONFIG'
          module.exports = {
            testDir: process.env.GITHUB_WORKSPACE +
              "/08.civilization-portal-site/civilization-portal-site-web/tests",
            testMatch: "r40-z233-lifeos-auth-ui.spec.cjs",
            timeout: 30000,
            retries: 0,
            reporter: [["line"], ["html", {
              outputFolder: "playwright-report",
              open: "never"
            }]],
            use: {
              baseURL: "http://127.0.0.1:31987",
              browserName: "chromium",
              headless: true,
              trace: "retain-on-failure",
              screenshot: "only-on-failure"
            },
            webServer: {
              cwd: process.env.GITHUB_WORKSPACE +
                "/08.civilization-portal-site/civilization-portal-site-web",
              command: "npm run dev -- --hostname 127.0.0.1 --port 31987",
              url: "http://127.0.0.1:31987/lifeos",
              timeout: 120000,
              reuseExistingServer: false
            }
          };
          CONFIG
          npx --no-install playwright test \
            --config=/tmp/r40-z233-playwright.config.cjs

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r40-z233-lifeos-ui-evidence
          path: |
            08.civilization-portal-site/civilization-portal-site-web/playwright-report/
            08.civilization-portal-site/civilization-portal-site-web/test-results/
          if-no-files-found: ignore
          retention-days: 7
