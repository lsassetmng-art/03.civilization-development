name: R20 Portal Isolated Validation

on:
  push:
    branches:
      - work/r20-portal-lifeos-auth-navigation-20261027
    paths:
      - '08.civilization-portal-site/civilization-portal-site-web/**'
      - '.github/workflows/r20-portal-isolated-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r20-portal-isolated-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: 08.civilization-portal-site/civilization-portal-site-web

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PORTAL_PERSONA_SESSION_SIGNING_SECRET: "r20-isolated-test-secret-not-for-production-2026"
      CIVILIZATION_OS_PUBLIC_BASE_URL: "http://127.0.0.1:3108"
      CIVILIZATION_PORTAL_PUBLIC_BASE_URL: "http://127.0.0.1:3107"

    steps:
      - name: Checkout R20
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 08.civilization-portal-site/civilization-portal-site-web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build

      - name: Unauthenticated OS route HTTP validation
        shell: bash
        run: |
          set -euo pipefail

          PORT=3107 npm run start -- --hostname 127.0.0.1 --port 3107 > "$RUNNER_TEMP/r20-next.log" 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null --max-time 2 http://127.0.0.1:3107/; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            cat "$RUNNER_TEMP/r20-next.log"
            exit 1
          fi

          for route in lifeos streaming-menu business-menu staticart-menu game-menu; do
            headers="$(curl -sS -D - -o /dev/null --max-time 10 "http://127.0.0.1:3107/$route")"
            status="$(printf '%s\n' "$headers" | head -1 | tr -d '\r')"
            location="$(printf '%s\n' "$headers" | grep -i '^location:' | head -1 | tr -d '\r' || true)"

            echo "ROUTE=/$route"
            echo "STATUS=$status"
            echo "LOCATION=$location"

            if ! printf '%s' "$status" | grep -Eq 'HTTP/[0-9.]+ 30[2378]'; then
              echo "FAIL=NO_AUTH_REDIRECT"
              exit 1
            fi

            if ! printf '%s' "$location" | grep -Fq "/api/persona/auth/start?return_to=%2F$route"; then
              echo "FAIL=UNEXPECTED_REDIRECT"
              exit 1
            fi

            echo "PASS=/$route"
          done

          echo "R20_UNAUTH_HTTP=PASS"

      - name: R20-5 Auth and session HTTP validation
        shell: bash
        run: |
          set -euo pipefail

          npm run start -- --hostname 127.0.0.1 --port 3109 > "$RUNNER_TEMP/r20-auth.log" 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3109/; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            cat "$RUNNER_TEMP/r20-auth.log"
            exit 1
          fi

          node tests/r20-auth-http.mjs

      - name: R20-7A Mock handoff E2E
        shell: bash
        env:
          CIVILIZATION_OS_PUBLIC_BASE_URL: "http://127.0.0.1:3108"
          CIVILIZATION_PORTAL_PUBLIC_BASE_URL: "http://127.0.0.1:3110"
        run: |
          set -euo pipefail

          node tests/r20-mock-civilization.mjs > "$RUNNER_TEMP/r20-mock.log" 2>&1 &
          MOCK_PID=$!

          npm run start -- --hostname 127.0.0.1 --port 3110 > "$RUNNER_TEMP/r20-e2e.log" 2>&1 &
          PORTAL_PID=$!

          cleanup() {
            kill "$MOCK_PID" "$PORTAL_PID" 2>/dev/null || true
            wait "$MOCK_PID" "$PORTAL_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0

          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:3108/health &&
               curl -fsS -o /dev/null http://127.0.0.1:3110/; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            cat "$RUNNER_TEMP/r20-mock.log"
            cat "$RUNNER_TEMP/r20-e2e.log"
            exit 1
          fi

          node tests/r20-handoff-e2e.mjs
