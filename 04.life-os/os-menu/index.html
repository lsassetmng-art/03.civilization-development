<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OS Menu</title>
  <link rel="stylesheet" href="./menu.css">
  <script src="./menu.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="header">
      <a class="portal-link" href="/">Civilization Portal</a>
      <span class="status">OS-owned menu</span>
    </header>

    <section class="hero" aria-labelledby="os-title">
      <p class="eyebrow">Civilization System</p>
      <h1 id="os-title">読み込み中</h1>
      <p id="os-description">OSメニューを準備しています。</p>
    </section>

    <section class="section" aria-labelledby="menu-heading">
      <h2 id="menu-heading">メニュー</h2>
      <div id="menu-grid" class="grid" aria-live="polite"></div>
    </section>

    <footer>
      <p id="ownership"></p>
      <p>機能接続は承認後に有効化されます。</p>
    </footer>
  </main>
</body>
</html>
